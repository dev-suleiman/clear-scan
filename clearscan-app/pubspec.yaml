name: clearscan_app
description: "AI-powered chest X-ray quality assessment"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  pdf: ^3.10.8
  intl: ^0.19.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  gal: ^2.3.0
  fl_chart: ^0.68.0
  image: ^4.1.0
  path: ^1.9.0
  flutter_litert: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
